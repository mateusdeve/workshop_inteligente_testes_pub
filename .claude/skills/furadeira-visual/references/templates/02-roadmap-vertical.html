<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Furadeira Roadmap: {{NOME_METODO}}</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf5ff;
    --bg-alt: #f3e8ff;
    --ink: #1e1b4b;
    --accent: #7c3aed;
    --line: #4c1d95;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    padding: 100px 80px;
    display: flex;
    flex-direction: column;
  }
  header { text-align: center; margin-bottom: 60px; }
  header .label {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    padding: 10px 24px;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  header h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 72px;
    font-weight: 800;
    color: var(--line);
    line-height: 1.05;
    margin-bottom: 20px;
  }
  header p {
    font-size: 28px;
    color: var(--muted);
    line-height: 1.4;
  }
  .timeline {
    position: relative;
    padding-left: 100px;
    flex: 1;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 40px;
    top: 20px;
    bottom: 20px;
    width: 6px;
    background: var(--accent);
    border-radius: 999px;
  }
  .etapa {
    position: relative;
    background: var(--bg-alt);
    border: 3px solid var(--line);
    border-radius: 20px;
    padding: 28px 32px;
    margin-bottom: 28px;
    box-shadow: 5px 5px 0 var(--line);
  }
  .etapa .num {
    position: absolute;
    left: -100px;
    top: 20px;
    width: 80px;
    height: 80px;
    background: var(--accent);
    color: #fff;
    border: 4px solid var(--bg);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 36px;
    font-weight: 800;
    box-shadow: 0 0 0 3px var(--line);
  }
  .etapa h3 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 32px;
    font-weight: 800;
    color: var(--line);
    margin-bottom: 10px;
    line-height: 1.15;
  }
  .etapa p {
    font-size: 20px;
    line-height: 1.45;
    color: var(--muted);
  }
  footer {
    text-align: center;
    margin-top: 40px;
    color: var(--muted);
    font-size: 22px;
    letter-spacing: 1.5px;
  }
</style>
</head>
<body>
  <header>
    <span class="label">Método</span>
    <h1>{{NOME_METODO}}</h1>
    <p>{{QUADRO}}</p>
  </header>
  <div class="timeline">
    <div class="etapa">
      <div class="num">1</div>
      <h3>{{ETAPA_NOME}}</h3>
      <p>{{ETAPA_DESCRICAO}}</p>
    </div>
    <!-- Repetir N vezes -->
  </div>
  <footer>{{NOME_PRODUTO}}</footer>
<!-- ===== Botão Baixar PNG (injetado automaticamente pela skill furadeira-visual) =====
  Regra: todo HTML gerado pelo fluxo HTML da Furadeira (command /furadeira-visual, opção 1)
  precisa conter este bloco imediatamente antes de </body>.
  Por quê: o aluno precisa conseguir exportar a Furadeira como imagem sem depender de script
  Python, Playwright, Puppeteer ou conhecimento técnico. Um clique no próprio HTML resolve.
  Como usar: copie o bloco inteiro (comentário e tudo) e cole antes de </body>. Não altere
  nomes de IDs, classes ou o nome do arquivo "furadeira.png" sem atualizar o command também.
-->
<button id="btn-baixar-furadeira" type="button" aria-label="Baixar Furadeira como PNG">Baixar PNG</button>
<style>
  #btn-baixar-furadeira {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 99999;
    padding: 12px 22px;
    background: #111827;
    color: #ffffff;
    border: 0;
    border-radius: 10px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #btn-baixar-furadeira:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
  }
  #btn-baixar-furadeira:disabled {
    opacity: 0.6;
    cursor: wait;
    transform: none;
  }
  @media print {
    #btn-baixar-furadeira { display: none; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function () {
  var btn = document.getElementById('btn-baixar-furadeira');
  if (!btn) return;
  btn.addEventListener('click', function () {
    if (typeof html2canvas === 'undefined') {
      alert('Não foi possível carregar a biblioteca de exportação. Verifique sua conexão com a internet e tente de novo.');
      return;
    }
    var textoOriginal = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Gerando PNG...';
    var corFundo = getComputedStyle(document.body).backgroundColor || '#ffffff';
    html2canvas(document.body, {
      backgroundColor: corFundo,
      scale: 2,
      useCORS: true,
      ignoreElements: function (el) { return el.id === 'btn-baixar-furadeira'; }
    }).then(function (canvas) {
      var link = document.createElement('a');
      link.download = 'furadeira.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }).catch(function (err) {
      console.error(err);
      alert('Não foi possível gerar o PNG: ' + (err && err.message ? err.message : 'erro desconhecido'));
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = textoOriginal;
    });
  });
})();
</script>
<!-- ===== Fim do bloco Baixar PNG ===== -->
</body>
</html>
