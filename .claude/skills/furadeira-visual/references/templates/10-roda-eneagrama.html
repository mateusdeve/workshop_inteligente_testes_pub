<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>{{NOME_METODO}}</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #111;
    --muted: #666;
    /* Cores dos arcos externos — 3 grupos por padrão */
    --arc-1: #e57373; /* grupo 1 */
    --arc-2: #4db6ac; /* grupo 2 */
    --arc-3: #81c784; /* grupo 3 */
    --line-color: #7e57c2;
    --point-fill: #7e57c2;
    --ring-bg: #f0f0f5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 40px;
  }

  .header { text-align: center; }
  .method-name {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 28px;
    font-weight: 900;
    color: var(--ink);
  }
  .quadro-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .wheel-wrap {
    position: relative;
    width: 780px;
    height: 780px;
  }

  svg.wheel {
    width: 100%;
    height: 100%;
  }

  /* Legenda dos grupos */
  .legend {
    display: flex;
    gap: 32px;
    align-items: center;
    justify-content: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }
  .legend-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .footer { font-size: 11px; color: #aaa; letter-spacing: 1.5px; text-transform: uppercase; }
</style>
</head>
<body>

  <div class="header">
    <div class="method-name">{{NOME_METODO}}</div>
    <div class="quadro-sub">{{QUADRO}}</div>
  </div>

  <div class="wheel-wrap">
    <svg class="wheel" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">

      <!-- Anel de fundo -->
      <circle cx="250" cy="250" r="230" fill="var(--ring-bg)" stroke="#ddd" stroke-width="1"/>
      <circle cx="250" cy="250" r="180" fill="white" stroke="#ddd" stroke-width="1"/>

      <!--
        ARCOS EXTERNOS (3 grupos de 3 pontos = 120° cada)
        Grupo 1: pontos 8, 9, 1 — arco superior (cor arc-1)
        Grupo 2: pontos 2, 3, 4 — arco direita (cor arc-2)
        Grupo 3: pontos 5, 6, 7 — arco esquerda (cor arc-3)

        Ângulos (0° = topo, sentido horário):
        Ponto 9: 0°  | 1: 40°  | 2: 80°  | 3: 120° | 4: 160°
        5: 200° | 6: 240° | 7: 280° | 8: 320°

        Arco 1 (8,9,1): 300° a 60°   — VERMELHO/CORAL
        Arco 2 (2,3,4): 60° a 180°   — VERDE-ÁGUA
        Arco 3 (5,6,7): 180° a 300°  — VERDE
      -->

      <!-- Arco 1: 300° a 60° -->
      <path d="
        M 250,250
        L 374.2,124.2
        A 180,180 0 0,1 374.2,375.8
        Z
      " fill="var(--arc-1)" opacity="0.85"/>

      <!-- Arco 2: 60° a 180° -->
      <path d="
        M 250,250
        L 374.2,375.8
        A 180,180 0 0,1 70,250
        Z
      " fill="var(--arc-2)" opacity="0.85"/>

      <!-- Arco 3: 180° a 300° -->
      <path d="
        M 250,250
        L 70,250
        A 180,180 0 0,1 374.2,124.2
        Z
      " fill="var(--arc-3)" opacity="0.85"/>

      <!-- Anel interno branco sobre os arcos -->
      <circle cx="250" cy="250" r="165" fill="white" stroke="#ddd" stroke-width="1"/>

      <!-- Separadores entre arcos -->
      <line x1="250" y1="250" x2="374.2" y2="124.2" stroke="white" stroke-width="3"/>
      <line x1="250" y1="250" x2="374.2" y2="375.8" stroke="white" stroke-width="3"/>
      <line x1="250" y1="250" x2="70" y2="250" stroke="white" stroke-width="3"/>

      <!--
        PONTOS NUMERADOS (raio 165)
        Ponto k está no ângulo: -90 + (k-1)*40 graus
        px = 250 + 165*cos(angle), py = 250 + 165*sin(angle)

        9: angle=-90°  → (250, 85)
        1: angle=-50°  → (356, 123)
        2: angle=-10°  → (413, 221)
        3: angle=30°   → (393, 333)
        4: angle=70°   → (307, 405)
        5: angle=110°  → (193, 405)
        6: angle=150°  → (107, 333)
        7: angle=190°  → (87, 221)
        8: angle=230°  → (144, 123)  (approx -130° = 230°)
      -->

      <!-- Linhas internas da estrela do eneagrama (conexões): 1-4-2-8-5-7-1 e triângulo 3-6-9 -->
      <g stroke="var(--line-color)" stroke-width="1.8" fill="none" opacity="0.75">
        <!-- Hexagrama: 1→4→2→8→5→7→1 -->
        <polyline points="356,123 307,405 413,221 144,123 193,405 87,221 356,123"/>
        <!-- Triângulo: 3→6→9 -->
        <polygon points="393,333 107,333 250,85"/>
      </g>

      <!-- Pontos numerados com círculos -->
      <g>
        <!-- Ponto 9 -->
        <circle cx="250" cy="85" r="18" fill="var(--arc-1)" stroke="white" stroke-width="2"/>
        <text x="250" y="91" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="16" font-weight="800" fill="white">9</text>

        <!-- Ponto 1 -->
        <circle cx="356" cy="123" r="18" fill="var(--arc-1)" stroke="white" stroke-width="2"/>
        <text x="356" y="129" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="16" font-weight="800" fill="white">1</text>

        <!-- Ponto 2 -->
        <circle cx="413" cy="221" r="18" fill="var(--arc-2)" stroke="white" stroke-width="2"/>
        <text x="413" y="227" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="16" font-weight="800" fill="white">2</text>

        <!-- Ponto 3 -->
        <circle cx="393" cy="333" r="18" fill="var(--arc-2)" stroke="white" stroke-width="2"/>
        <text x="393" y="339" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="16" font-weight="800" fill="white">3</text>

        <!-- Ponto 4 -->
        <circle cx="307" cy="405" r="18" fill="var(--arc-2)" stroke="white" stroke-width="2"/>
        <text x="307" y="411" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="16" font-weight="800" fill="white">4</text>

        <!-- Ponto 5 -->
        <circle cx="193" cy="405" r="18" fill="var(--arc-3)" stroke="white" stroke-width="2"/>
        <text x="193" y="411" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="16" font-weight="800" fill="white">5</text>

        <!-- Ponto 6 -->
        <circle cx="107" cy="333" r="18" fill="var(--arc-3)" stroke="white" stroke-width="2"/>
        <text x="107" y="339" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="16" font-weight="800" fill="white">6</text>

        <!-- Ponto 7 -->
        <circle cx="87" cy="221" r="18" fill="var(--arc-3)" stroke="white" stroke-width="2"/>
        <text x="87" y="227" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="16" font-weight="800" fill="white">7</text>

        <!-- Ponto 8 -->
        <circle cx="144" cy="123" r="18" fill="var(--arc-1)" stroke="white" stroke-width="2"/>
        <text x="144" y="129" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="16" font-weight="800" fill="white">8</text>
      </g>

      <!-- Labels dos grupos nos arcos externos -->
      <text x="250" y="52" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="13" font-weight="800" fill="white" transform="rotate(0,250,52)">{{GRUPO_1}}</text>
      <text x="415" y="340" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="13" font-weight="800" fill="white" transform="rotate(60,415,340)">{{GRUPO_2}}</text>
      <text x="85" y="340" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="13" font-weight="800" fill="white" transform="rotate(-60,85,340)">{{GRUPO_3}}</text>

      <!-- Labels dos pontos individuais (raio ~210, fora do anel) -->
      <text x="250" y="32" text-anchor="middle" font-family="Inter" font-size="11" fill="var(--muted)">{{PONTO_9}}</text>
      <text x="388" y="98" text-anchor="middle" font-family="Inter" font-size="11" fill="var(--muted)">{{PONTO_1}}</text>
      <text x="448" y="210" text-anchor="start" font-family="Inter" font-size="11" fill="var(--muted)">{{PONTO_2}}</text>
      <text x="432" y="348" text-anchor="start" font-family="Inter" font-size="11" fill="var(--muted)">{{PONTO_3}}</text>
      <text x="320" y="438" text-anchor="middle" font-family="Inter" font-size="11" fill="var(--muted)">{{PONTO_4}}</text>
      <text x="180" y="438" text-anchor="middle" font-family="Inter" font-size="11" fill="var(--muted)">{{PONTO_5}}</text>
      <text x="68" y="348" text-anchor="end" font-family="Inter" font-size="11" fill="var(--muted)">{{PONTO_6}}</text>
      <text x="52" y="210" text-anchor="end" font-family="Inter" font-size="11" fill="var(--muted)">{{PONTO_7}}</text>
      <text x="112" y="98" text-anchor="middle" font-family="Inter" font-size="11" fill="var(--muted)">{{PONTO_8}}</text>

      <!-- Centro -->
      <circle cx="250" cy="250" r="50" fill="white" stroke="#ddd" stroke-width="1.5"/>
      <text x="250" y="246" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="11" font-weight="700" fill="var(--ink)">{{CENTRO_1}}</text>
      <text x="250" y="262" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="11" font-weight="700" fill="var(--ink)">{{CENTRO_2}}</text>

    </svg>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--arc-1)"></div>{{GRUPO_1}}</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--arc-2)"></div>{{GRUPO_2}}</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--arc-3)"></div>{{GRUPO_3}}</div>
  </div>

  <div class="footer">{{NOME_PRODUTO}} · Metodologia exclusiva</div>

<!-- ===== Botão Baixar PNG (injetado automaticamente pela skill furadeira-visual) =====
  Regra: todo HTML gerado pelo fluxo HTML da Furadeira (command /furadeira-visual, opção 1)
  precisa conter este bloco imediatamente antes de </body>.
  Por quê: o aluno precisa conseguir exportar a Furadeira como imagem sem depender de script
  Python, Playwright, Puppeteer ou conhecimento técnico. Um clique no próprio HTML resolve.
  Como usar: copie o bloco inteiro (comentário e tudo) e cole antes de </body>. Não altere
  nomes de IDs, classes ou o nome do arquivo "furadeira.png" sem atualizar o command também.
-->
<button id="btn-baixar-furadeira" type="button" aria-label="Baixar Furadeira como PNG">Baixar PNG</button>
<style>
  #btn-baixar-furadeira {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 99999;
    padding: 12px 22px;
    background: #111827;
    color: #ffffff;
    border: 0;
    border-radius: 10px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #btn-baixar-furadeira:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
  }
  #btn-baixar-furadeira:disabled {
    opacity: 0.6;
    cursor: wait;
    transform: none;
  }
  @media print {
    #btn-baixar-furadeira { display: none; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function () {
  var btn = document.getElementById('btn-baixar-furadeira');
  if (!btn) return;
  btn.addEventListener('click', function () {
    if (typeof html2canvas === 'undefined') {
      alert('Não foi possível carregar a biblioteca de exportação. Verifique sua conexão com a internet e tente de novo.');
      return;
    }
    var textoOriginal = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Gerando PNG...';
    var corFundo = getComputedStyle(document.body).backgroundColor || '#ffffff';
    html2canvas(document.body, {
      backgroundColor: corFundo,
      scale: 2,
      useCORS: true,
      ignoreElements: function (el) { return el.id === 'btn-baixar-furadeira'; }
    }).then(function (canvas) {
      var link = document.createElement('a');
      link.download = 'furadeira.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }).catch(function (err) {
      console.error(err);
      alert('Não foi possível gerar o PNG: ' + (err && err.message ? err.message : 'erro desconhecido'));
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = textoOriginal;
    });
  });
})();
</script>
<!-- ===== Fim do bloco Baixar PNG ===== -->
</body>
</html>
