<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Furadeira Linear: {{NOME_METODO}}</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8fafc;
    --bg-alt: #e0f2fe;
    --ink: #0f172a;
    --accent: #2563eb;
    --line: #1e40af;
    --muted: #475569;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    padding: 80px 100px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  header { text-align: center; margin-bottom: 40px; }
  header .label {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    padding: 8px 20px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  header h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 56px;
    font-weight: 800;
    color: var(--line);
    margin-bottom: 12px;
  }
  header p {
    font-size: 22px;
    color: var(--muted);
    max-width: 900px;
    margin: 0 auto;
  }
  .etapas {
    display: grid;
    grid-template-columns: repeat({{N_ETAPAS}}, 1fr);
    gap: 24px;
    align-items: stretch;
    flex: 1;
    position: relative;
    padding: 40px 0;
  }
  .etapa {
    background: var(--bg-alt);
    border: 3px solid var(--line);
    border-radius: 24px;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    box-shadow: 6px 6px 0 var(--line);
  }
  .etapa .num {
    position: absolute;
    top: -28px;
    width: 56px;
    height: 56px;
    background: var(--accent);
    color: #fff;
    border: 3px solid var(--line);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 24px;
    font-weight: 800;
  }
  .etapa h3 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 26px;
    font-weight: 800;
    color: var(--line);
    margin: 24px 0 16px;
    line-height: 1.15;
  }
  .etapa p {
    font-size: 16px;
    line-height: 1.5;
    color: var(--muted);
  }
  .seta {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: var(--accent);
    font-size: 36px;
    font-weight: 800;
    z-index: 2;
  }
  footer {
    text-align: center;
    margin-top: 32px;
    color: var(--muted);
    font-size: 18px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <header>
    <span class="label">Método</span>
    <h1>{{NOME_METODO}}</h1>
    <p>{{QUADRO}}</p>
  </header>
  <div class="etapas">
    <!-- Repetir N vezes -->
    <div class="etapa">
      <div class="num">1</div>
      <h3>{{ETAPA_NOME}}</h3>
      <p>{{ETAPA_DESCRICAO}}</p>
    </div>
  </div>
  <footer>{{NOME_PRODUTO}}</footer>
</body>
</html>
