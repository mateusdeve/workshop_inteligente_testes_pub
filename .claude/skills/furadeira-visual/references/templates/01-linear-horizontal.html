<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Furadeira Linear: {{NOME_METODO}}</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8fafc;
    --bg-alt: #e0f2fe;
    --ink: #0f172a;
    --accent: #2563eb;
    --line: #1e40af;
    --muted: #475569;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    padding: 80px 100px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  header { text-align: center; margin-bottom: 40px; }
  header .label {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    padding: 8px 20px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  header h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 56px;
    font-weight: 800;
    color: var(--line);
    margin-bottom: 12px;
  }
  header p {
    font-size: 22px;
    color: var(--muted);
    max-width: 900px;
    margin: 0 auto;
  }
  .etapas {
    display: grid;
    grid-template-columns: repeat({{N_ETAPAS}}, 1fr);
    gap: 24px;
    align-items: stretch;
    flex: 1;
    position: relative;
    padding: 40px 0;
  }
  .etapa {
    background: var(--bg-alt);
    border: 3px solid var(--line);
    border-radius: 24px;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    box-shadow: 6px 6px 0 var(--line);
  }
  .etapa .num {
    position: absolute;
    top: -28px;
    width: 56px;
    height: 56px;
    background: var(--accent);
    color: #fff;
    border: 3px solid var(--line);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 24px;
    font-weight: 800;
  }
  .etapa h3 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 26px;
    font-weight: 800;
    color: var(--line);
    margin: 24px 0 16px;
    line-height: 1.15;
  }
  .etapa p {
    font-size: 16px;
    line-height: 1.5;
    color: var(--muted);
  }
  .seta {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: var(--accent);
    font-size: 36px;
    font-weight: 800;
    z-index: 2;
  }
  footer {
    text-align: center;
    margin-top: 32px;
    color: var(--muted);
    font-size: 18px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <header>
    <span class="label">Método</span>
    <h1>{{NOME_METODO}}</h1>
    <p>{{QUADRO}}</p>
  </header>
  <div class="etapas">
    <!-- Repetir N vezes -->
    <div class="etapa">
      <div class="num">1</div>
      <h3>{{ETAPA_NOME}}</h3>
      <p>{{ETAPA_DESCRICAO}}</p>
    </div>
  </div>
<!-- ===== Botão Baixar PNG (injetado automaticamente pela skill furadeira-visual) =====
  Regra: todo HTML gerado pelo fluxo HTML da Furadeira (command /furadeira-visual, opção 1)
  precisa conter este bloco imediatamente antes de </body>.
  Por quê: o aluno precisa conseguir exportar a Furadeira como imagem sem depender de script
  Python, Playwright, Puppeteer ou conhecimento técnico. Um clique no próprio HTML resolve.
  Como usar: copie o bloco inteiro (comentário e tudo) e cole antes de </body>. Não altere
  nomes de IDs, classes ou o nome do arquivo "furadeira.png" sem atualizar o command também.
-->
<button id="btn-baixar-furadeira" type="button" aria-label="Baixar Furadeira como PNG">Baixar PNG</button>
<style>
  #btn-baixar-furadeira {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 99999;
    padding: 12px 22px;
    background: #111827;
    color: #ffffff;
    border: 0;
    border-radius: 10px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #btn-baixar-furadeira:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
  }
  #btn-baixar-furadeira:disabled {
    opacity: 0.6;
    cursor: wait;
    transform: none;
  }
  @media print {
    #btn-baixar-furadeira { display: none; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function () {
  var btn = document.getElementById('btn-baixar-furadeira');
  if (!btn) return;
  btn.addEventListener('click', function () {
    if (typeof html2canvas === 'undefined') {
      alert('Não foi possível carregar a biblioteca de exportação. Verifique sua conexão com a internet e tente de novo.');
      return;
    }
    var textoOriginal = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Gerando PNG...';
    var origBg = document.body.style.background;
    document.body.style.background = 'transparent';
    html2canvas(document.body, {
      backgroundColor: null,
      scale: 2,
      useCORS: true,
      ignoreElements: function (el) { return el.id === 'btn-baixar-furadeira'; }
    }).then(function (canvas) {
      document.body.style.background = origBg;
      var link = document.createElement('a');
      link.download = 'furadeira.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }).catch(function (err) {
      document.body.style.background = origBg;
      console.error(err);
      alert('Não foi possível gerar o PNG: ' + (err && err.message ? err.message : 'erro desconhecido'));
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = textoOriginal;
    });
  });
})();
</script>
<!-- ===== Fim do bloco Baixar PNG ===== -->
</body>
</html>
