<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>{{NOME_METODO}}</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #111;
    --muted: #555;
    /* 8 cores para os 8 setores — ajustar conforme paleta */
    --s1: #e53e3e; --s2: #805ad5; --s3: #38a169;
    --s4: #3182ce; --s5: #718096; --s6: #dd6b20;
    --s7: #d53f8c; --s8: #2d3748;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 40px;
  }
  .header { text-align: center; }
  .method-name { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 28px; font-weight: 900; color: var(--ink); }
  .quadro-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .wheel-wrap { position: relative; width: 820px; height: 820px; }
  .footer { font-size: 11px; color: #aaa; letter-spacing: 1.5px; text-transform: uppercase; }
</style>
</head>
<body>

<div class="header">
  <div class="method-name">{{NOME_METODO}}</div>
  <div class="quadro-sub">{{QUADRO}}</div>
</div>

<div class="wheel-wrap">
<svg viewBox="0 0 500 500" width="820" height="820" xmlns="http://www.w3.org/2000/svg">

  <!--
    8 setores de 45° cada, começando pelo topo (N = 0°, sentido horário)
    Setor k: de -90 + (k-1)*45 até -90 + k*45 graus
    Raio externo: 230, raio interno: 75

    Setor 1 (N,   0°- 45°):  ângulo médio  22.5°
    Setor 2 (NE, 45°- 90°):  ângulo médio  67.5°
    Setor 3 (L,  90°-135°):  ângulo médio 112.5°
    Setor 4 (SE,135°-180°):  ângulo médio 157.5°
    Setor 5 (S, 180°-225°):  ângulo médio 202.5°
    Setor 6 (SO,225°-270°):  ângulo médio 247.5°
    Setor 7 (O, 270°-315°):  ângulo médio 292.5°
    Setor 8 (NO,315°-360°):  ângulo médio 337.5°

    path para setor k (ângulo a1 → a2, graus):
    M cx+ri*cos(a1-90°), cy+ri*sin(a1-90°)
    L cx+re*cos(a1-90°), cy+re*sin(a1-90°)
    A re re 0 0 1 cx+re*cos(a2-90°), cy+re*sin(a2-90°)
    L cx+ri*cos(a2-90°), cy+ri*sin(a2-90°)
    A ri ri 0 0 0 cx+ri*cos(a1-90°), cy+ri*sin(a1-90°)
    Z

    cx=cy=250, re=230, ri=75

    Pré-calculado (rad = (deg-90)*PI/180):
    S1: 0°→45°  → start:(-90°)=270°, end:(-45°)=315°
    Pontos re=230:
      0°-90°=-90° → cos(-90°)=0,sin(-90°)=-1 → (250,20)
      45°-90°=-45° → cos(-45°)=0.707,sin(-45°)=-0.707 → (413,87)
    ri=75:
      (250,175), (303,197)
  -->

  <!-- SETOR 1: N — topo (0°→45°) -->
  <path d="M 250,175 L 250,20 A 230,230 0 0,1 413,87 L 303,197 A 75,75 0 0,0 250,175 Z"
        fill="var(--s1)" stroke="white" stroke-width="3"/>
  <!-- SETOR 2: NE (45°→90°) -->
  <path d="M 303,197 L 413,87 A 230,230 0 0,1 480,250 L 325,250 A 75,75 0 0,0 303,197 Z"
        fill="var(--s2)" stroke="white" stroke-width="3"/>
  <!-- SETOR 3: L (90°→135°) -->
  <path d="M 325,250 L 480,250 A 230,230 0 0,1 413,413 L 303,303 A 75,75 0 0,0 325,250 Z"
        fill="var(--s3)" stroke="white" stroke-width="3"/>
  <!-- SETOR 4: SE (135°→180°) -->
  <path d="M 303,303 L 413,413 A 230,230 0 0,1 250,480 L 250,325 A 75,75 0 0,0 303,303 Z"
        fill="var(--s4)" stroke="white" stroke-width="3"/>
  <!-- SETOR 5: S (180°→225°) -->
  <path d="M 250,325 L 250,480 A 230,230 0 0,1 87,413 L 197,303 A 75,75 0 0,0 250,325 Z"
        fill="var(--s5)" stroke="white" stroke-width="3"/>
  <!-- SETOR 6: SO (225°→270°) -->
  <path d="M 197,303 L 87,413 A 230,230 0 0,1 20,250 L 175,250 A 75,75 0 0,0 197,303 Z"
        fill="var(--s6)" stroke="white" stroke-width="3"/>
  <!-- SETOR 7: O (270°→315°) -->
  <path d="M 175,250 L 20,250 A 230,230 0 0,1 87,87 L 197,197 A 75,75 0 0,0 175,250 Z"
        fill="var(--s7)" stroke="white" stroke-width="3"/>
  <!-- SETOR 8: NO (315°→360°) -->
  <path d="M 197,197 L 87,87 A 230,230 0 0,1 250,20 L 250,175 A 75,75 0 0,0 197,197 Z"
        fill="var(--s8)" stroke="white" stroke-width="3"/>

  <!-- CENTRO BRANCO -->
  <circle cx="250" cy="250" r="75" fill="white" stroke="#ddd" stroke-width="2"/>
  <text x="250" y="244" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="11" font-weight="700" fill="#333">{{CENTRO_1}}</text>
  <text x="250" y="260" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="11" font-weight="700" fill="#333">{{CENTRO_2}}</text>

  <!-- LABELS DOS SETORES (posicionados no meio de cada setor, raio ~160) -->
  <!-- Ângulo médio de cada setor, raio 155 a partir do centro -->
  <!-- S1 N: 22.5° → (-90°+22.5°)=-67.5° → cos=-0.383,sin=-0.924 → 250+155*(-0.383)=191, 250+155*(-0.924)=107 -->
  <text x="250" y="110" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="13" font-weight="900" fill="white">{{DIRECAO_1}}</text>
  <text x="250" y="126" text-anchor="middle" font-family="Inter" font-size="10" fill="rgba(255,255,255,0.85)">{{SETOR_1}}</text>

  <!-- S2 NE: 67.5° → (-90+67.5)=-22.5° → cos=0.924,sin=-0.383 → (393,191) -->
  <text x="382" y="186" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="13" font-weight="900" fill="white" transform="rotate(45,382,186)">{{DIRECAO_2}}</text>
  <text x="382" y="200" text-anchor="middle" font-family="Inter" font-size="10" fill="rgba(255,255,255,0.85)" transform="rotate(45,382,200)">{{SETOR_2}}</text>

  <!-- S3 L: 112.5° → 22.5° → cos=0.924,sin=0.383 → (393,309) -->
  <text x="390" y="255" text-anchor="start" font-family="Plus Jakarta Sans" font-size="13" font-weight="900" fill="white" transform="rotate(90,390,255)">{{DIRECAO_3}}</text>
  <text x="382" y="300" text-anchor="middle" font-family="Inter" font-size="10" fill="rgba(255,255,255,0.85)" transform="rotate(90,382,300)">{{SETOR_3}}</text>

  <!-- S4 SE: 157.5° → 67.5° → cos=0.383,sin=0.924 → (309,393) -->
  <text x="308" y="382" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="13" font-weight="900" fill="white" transform="rotate(135,308,382)">{{DIRECAO_4}}</text>
  <text x="308" y="396" text-anchor="middle" font-family="Inter" font-size="10" fill="rgba(255,255,255,0.85)" transform="rotate(135,308,396)">{{SETOR_4}}</text>

  <!-- S5 S: 202.5° → 112.5° → cos=-0.383,sin=0.924 → (191,393) -->
  <text x="250" y="392" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="13" font-weight="900" fill="white">{{DIRECAO_5}}</text>
  <text x="250" y="406" text-anchor="middle" font-family="Inter" font-size="10" fill="rgba(255,255,255,0.85)">{{SETOR_5}}</text>

  <!-- S6 SO: 247.5° → 157.5° → cos=-0.924,sin=0.383 → (107,309) -->
  <text x="118" y="308" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="13" font-weight="900" fill="white" transform="rotate(-135,118,308)">{{DIRECAO_6}}</text>
  <text x="118" y="322" text-anchor="middle" font-family="Inter" font-size="10" fill="rgba(255,255,255,0.85)" transform="rotate(-135,118,322)">{{SETOR_6}}</text>

  <!-- S7 O: 292.5° → 202.5° → cos=-0.924,sin=-0.383 → (107,191) -->
  <text x="110" y="255" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="13" font-weight="900" fill="white" transform="rotate(-90,110,255)">{{DIRECAO_7}}</text>
  <text x="118" y="200" text-anchor="middle" font-family="Inter" font-size="10" fill="rgba(255,255,255,0.85)" transform="rotate(-90,118,200)">{{SETOR_7}}</text>

  <!-- S8 NO: 337.5° → 247.5° → cos=-0.383,sin=-0.924 → (191,107) -->
  <text x="192" y="186" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="13" font-weight="900" fill="white" transform="rotate(-45,192,186)">{{DIRECAO_8}}</text>
  <text x="192" y="200" text-anchor="middle" font-family="Inter" font-size="10" fill="rgba(255,255,255,0.85)" transform="rotate(-45,192,200)">{{SETOR_8}}</text>

</svg>
</div>

<div class="footer">{{NOME_PRODUTO}} · Metodologia exclusiva</div>
<!-- ===== Botão Baixar PNG (injetado automaticamente pela skill furadeira-visual) =====
  Regra: todo HTML gerado pelo fluxo HTML da Furadeira (command /furadeira-visual, opção 1)
  precisa conter este bloco imediatamente antes de </body>.
  Por quê: o aluno precisa conseguir exportar a Furadeira como imagem sem depender de script
  Python, Playwright, Puppeteer ou conhecimento técnico. Um clique no próprio HTML resolve.
  Como usar: copie o bloco inteiro (comentário e tudo) e cole antes de </body>. Não altere
  nomes de IDs, classes ou o nome do arquivo "furadeira.png" sem atualizar o command também.
-->
<button id="btn-baixar-furadeira" type="button" aria-label="Baixar Furadeira como PNG">Baixar PNG</button>
<style>
  #btn-baixar-furadeira {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 99999;
    padding: 12px 22px;
    background: #111827;
    color: #ffffff;
    border: 0;
    border-radius: 10px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #btn-baixar-furadeira:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
  }
  #btn-baixar-furadeira:disabled {
    opacity: 0.6;
    cursor: wait;
    transform: none;
  }
  @media print {
    #btn-baixar-furadeira { display: none; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function () {
  var btn = document.getElementById('btn-baixar-furadeira');
  if (!btn) return;
  btn.addEventListener('click', function () {
    if (typeof html2canvas === 'undefined') {
      alert('Não foi possível carregar a biblioteca de exportação. Verifique sua conexão com a internet e tente de novo.');
      return;
    }
    var textoOriginal = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Gerando PNG...';
    var origBg = document.body.style.background;
    document.body.style.background = 'transparent';
    html2canvas(document.body, {
      backgroundColor: null,
      scale: 2,
      useCORS: true,
      ignoreElements: function (el) { return el.id === 'btn-baixar-furadeira'; }
    }).then(function (canvas) {
      document.body.style.background = origBg;
      var link = document.createElement('a');
      link.download = 'furadeira.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }).catch(function (err) {
      document.body.style.background = origBg;
      console.error(err);
      alert('Não foi possível gerar o PNG: ' + (err && err.message ? err.message : 'erro desconhecido'));
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = textoOriginal;
    });
  });
})();
</script>
<!-- ===== Fim do bloco Baixar PNG ===== -->
</body>
</html>
