<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>{{NOME_METODO}}</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f8f8;
    --grid-line: #e0e0e0;
    --curve-fill: rgba(180,180,180,0.35);
    --curve-stroke: #888;
    --axis-ink: #333;
    --muted: #aaa;
    --zone-ink: #bbb;
    /* Cores das badges por nível — ajustar conforme produto */
    --b1: #ffffff; --b1-border: #111; --b1-ink: #111;  /* nível 1 */
    --b2: #e040fb; --b2-ink: #fff;                      /* nível 2 */
    --b3: #111111; --b3-ink: #fff;                      /* nível 3 */
    --b4: #9c27b0; --b4-ink: #fff;                      /* nível 4 */
    --b5: #c6ff00; --b5-ink: #111;                      /* nível 5 */
    --b6: #9e9e9e; --b6-ink: #fff;                      /* nível 6 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 640px; overflow: hidden; }
  body {
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--axis-ink);
    padding: 40px 60px 50px 80px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* TÍTULO */
  .chart-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
    color: var(--axis-ink);
    margin-bottom: 12px;
  }

  /* ÁREA DO GRÁFICO */
  .chart-area {
    position: relative;
    flex: 1;
    width: 100%;
  }

  svg.chart {
    width: 100%;
    height: 100%;
  }

  /* BADGES DOS NÍVEIS */
  .badge-wrap {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: translateX(-50%);
    pointer-events: none;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 5px 14px;
    border-radius: 100px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .badge.b1 { background: var(--b1); color: var(--b1-ink); border: 2px solid var(--b1-border); }
  .badge.b2 { background: var(--b2); color: var(--b2-ink); }
  .badge.b3 { background: var(--b3); color: var(--b3-ink); }
  .badge.b4 { background: var(--b4); color: var(--b4-ink); }
  .badge.b5 { background: var(--b5); color: var(--b5-ink); }
  .badge.b6 { background: var(--b6); color: var(--b6-ink); }
  .badge-line {
    width: 1.5px;
    height: 20px;
    background: currentColor;
    opacity: 0.5;
  }
  .badge-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  }

  /* NOME DAS ZONAS */
  .zone-label {
    position: absolute;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--zone-ink);
    transform: translateX(-50%);
    bottom: 28px;
  }

  /* RODAPÉ */
  .footer { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-align: center; margin-top: 8px; }
</style>
</head>
<body>

<div class="chart-title">{{NOME_METODO}}</div>

<div class="chart-area" id="chartArea">
<svg class="chart" viewBox="0 0 920 480" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">

  <!-- GRID DE FUNDO -->
  <defs>
    <pattern id="grid" width="46" height="48" patternUnits="userSpaceOnUse">
      <path d="M 46 0 L 0 0 0 48" fill="none" stroke="#e0e0e0" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect x="60" y="0" width="860" height="420" fill="url(#grid)"/>

  <!-- EIXO Y (esquerda) -->
  <!-- Linhas horizontais de referência e labels -->
  <!-- y=420 = 0, y=340 = R$10k, y=260 = R$100k, y=180 = R$2M, y=100 = R$10M, y=20 = ∞ -->
  <line x1="60" y1="420" x2="920" y2="420" stroke="#ccc" stroke-width="1"/>
  <line x1="60" y1="340" x2="920" y2="340" stroke="#ddd" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="60" y1="260" x2="920" y2="260" stroke="#ddd" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="60" y1="180" x2="920" y2="180" stroke="#ddd" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="60" y1="100" x2="920" y2="100" stroke="#ddd" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="60" y1="20" x2="920" y2="20" stroke="#ddd" stroke-width="0.8" stroke-dasharray="4,4"/>

  <!-- Labels eixo Y -->
  <text x="52" y="424" text-anchor="end" font-family="Inter" font-size="9" fill="#999">{{NIVEL_0}}</text>
  <text x="52" y="344" text-anchor="end" font-family="Inter" font-size="9" fill="#999">{{NIVEL_1}}</text>
  <text x="52" y="264" text-anchor="end" font-family="Inter" font-size="9" fill="#999">{{NIVEL_2}}</text>
  <text x="52" y="184" text-anchor="end" font-family="Inter" font-size="9" fill="#999">{{NIVEL_3}}</text>
  <text x="52" y="104" text-anchor="end" font-family="Inter" font-size="9" fill="#999">{{NIVEL_4}}</text>
  <text x="52" y="26" text-anchor="end" font-family="Inter" font-size="11" fill="#777">∞</text>

  <!--
    CURVA EXPONENCIAL (preenchida)
    Pontos-chave (x=posição horizontal, y=altura):
    Início: (100, 420) — 0
    Nível 1: (180, 415) — quase zero
    Nível 2: (260, 408) — ainda baixo
    Nível 3: (400, 390) — começa subir
    Nível 4: (570, 330) — aceleração
    Nível 5: (720, 230) — rápido
    Nível 6: (840, 110) — exponencial
    Fim curva: (920, 20)

    Path: area preenchida até o eixo X
  -->
  <path d="
    M 100,420
    C 130,420 160,420 180,415
    C 210,412 240,410 260,408
    C 310,404 360,400 400,390
    C 460,374 510,350 570,330
    C 630,308 670,270 720,230
    C 760,196 800,155 840,110
    C 870,76 895,45 920,20
    L 920,420 Z
  " fill="var(--curve-fill)" stroke="none"/>

  <!-- Linha da curva (mais escura) -->
  <path d="
    M 100,420
    C 130,420 160,420 180,415
    C 210,412 240,410 260,408
    C 310,404 360,400 400,390
    C 460,374 510,350 570,330
    C 630,308 670,270 720,230
    C 760,196 800,155 840,110
    C 870,76 895,45 920,20
  " fill="none" stroke="var(--curve-stroke)" stroke-width="2"/>

  <!-- Linhas pontilhadas de referência dos marcos -->
  <line x1="180" y1="415" x2="60" y2="415" stroke="#ccc" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="260" y1="408" x2="60" y2="408" stroke="#ccc" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="400" y1="390" x2="60" y2="390" stroke="#ccc" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="570" y1="330" x2="60" y2="330" stroke="#ccc" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="720" y1="230" x2="60" y2="230" stroke="#ccc" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="840" y1="110" x2="60" y2="110" stroke="#ccc" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- EIXO X (fases) -->
  <text x="140" y="445" text-anchor="middle" font-family="Inter" font-size="8.5" fill="#aaa">{{FASE_1}}</text>
  <text x="220" y="445" text-anchor="middle" font-family="Inter" font-size="8.5" fill="#aaa">{{FASE_2}}</text>
  <text x="320" y="445" text-anchor="middle" font-family="Inter" font-size="8.5" fill="#aaa">{{FASE_3}}</text>

  <!-- Pontos dos marcos na curva -->
  <circle cx="180" cy="415" r="5" fill="#111" stroke="white" stroke-width="2"/>
  <circle cx="260" cy="408" r="5" fill="#111" stroke="white" stroke-width="2"/>
  <circle cx="400" cy="390" r="6" fill="var(--b3)" stroke="white" stroke-width="2"/>
  <circle cx="570" cy="330" r="6" fill="var(--b4)" stroke="white" stroke-width="2"/>
  <circle cx="720" cy="230" r="7" fill="var(--b5-ink, #111)" stroke="white" stroke-width="2.5"/>
  <circle cx="840" cy="110" r="7" fill="var(--b6)" stroke="white" stroke-width="2.5"/>

  <!-- NOMES DAS ZONAS (fundo da curva) -->
  <text x="220" y="460" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#ccc" letter-spacing="2">{{ZONA_1}}</text>
  <text x="480" y="460" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#ccc" letter-spacing="2">{{ZONA_2}}</text>
  <text x="645" y="460" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#ccc" letter-spacing="2">{{ZONA_3}}</text>
  <text x="780" y="460" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#ccc" letter-spacing="2">{{ZONA_4}}</text>
  <text x="880" y="460" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#ccc" letter-spacing="2">{{ZONA_5}}</text>

</svg>

<!-- BADGES posicionadas sobre o SVG -->

<!-- Nível 1 (NEWBIE) -->
<div class="badge-wrap" style="left:calc(180px * (920/920) * (100%/920)); top: calc(415px * (100%/480) - 52px);">
  <!-- Usar posição absoluta percentual baseada nos pontos SVG -->
</div>

<!-- Abordagem mais simples: badges posicionadas com % fixas -->
<div style="position:absolute; left:0; top:0; width:100%; height:100%;">

  <!-- Marco 1 -->
  <div class="badge-wrap" style="left:19.6%; top:71%;">
    <div class="badge b1">{{MARCO_1}}</div>
    <div class="badge-line" style="color:#111"></div>
    <div class="badge-dot" style="background:#111"></div>
  </div>

  <!-- Marco 2 -->
  <div class="badge-wrap" style="left:28.3%; top:69%;">
    <div class="badge b2">{{MARCO_2}}</div>
    <div class="badge-line" style="color:var(--b2)"></div>
    <div class="badge-dot" style="background:var(--b2)"></div>
  </div>

  <!-- Marco 3 -->
  <div class="badge-wrap" style="left:43.5%; top:61%;">
    <div class="badge b3">{{MARCO_3}}</div>
    <div class="badge-line" style="color:#111"></div>
    <div class="badge-dot" style="background:var(--b3)"></div>
  </div>

  <!-- Marco 4 -->
  <div class="badge-wrap" style="left:62%; top:44%;">
    <div class="badge b4">{{MARCO_4}}</div>
    <div class="badge-line" style="color:var(--b4)"></div>
    <div class="badge-dot" style="background:var(--b4)"></div>
  </div>

  <!-- Marco 5 -->
  <div class="badge-wrap" style="left:78.3%; top:23%;">
    <div class="badge b5">{{MARCO_5}}</div>
    <div class="badge-line" style="color:#888"></div>
    <div class="badge-dot" style="background:#111"></div>
  </div>

  <!-- Marco 6 -->
  <div class="badge-wrap" style="left:91.3%; top:1%;">
    <div class="badge b6">{{MARCO_6}}</div>
    <div class="badge-line" style="color:#999"></div>
    <div class="badge-dot" style="background:var(--b6)"></div>
  </div>

</div>
</div>

<div class="footer">{{NOME_PRODUTO}} · {{QUADRO}}</div>

<!-- ===== Botão Baixar PNG (injetado automaticamente pela skill furadeira-visual) =====
  Regra: todo HTML gerado pelo fluxo HTML da Furadeira (command /furadeira-visual, opção 1)
  precisa conter este bloco imediatamente antes de </body>.
  Por quê: o aluno precisa conseguir exportar a Furadeira como imagem sem depender de script
  Python, Playwright, Puppeteer ou conhecimento técnico. Um clique no próprio HTML resolve.
  Como usar: copie o bloco inteiro (comentário e tudo) e cole antes de </body>. Não altere
  nomes de IDs, classes ou o nome do arquivo "furadeira.png" sem atualizar o command também.
-->
<button id="btn-baixar-furadeira" type="button" aria-label="Baixar Furadeira como PNG">Baixar PNG</button>
<style>
  #btn-baixar-furadeira {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 99999;
    padding: 12px 22px;
    background: #111827;
    color: #ffffff;
    border: 0;
    border-radius: 10px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #btn-baixar-furadeira:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
  }
  #btn-baixar-furadeira:disabled {
    opacity: 0.6;
    cursor: wait;
    transform: none;
  }
  @media print {
    #btn-baixar-furadeira { display: none; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function () {
  var btn = document.getElementById('btn-baixar-furadeira');
  if (!btn) return;
  btn.addEventListener('click', function () {
    if (typeof html2canvas === 'undefined') {
      alert('Não foi possível carregar a biblioteca de exportação. Verifique sua conexão com a internet e tente de novo.');
      return;
    }
    var textoOriginal = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Gerando PNG...';
    var corFundo = getComputedStyle(document.body).backgroundColor || '#ffffff';
    html2canvas(document.body, {
      backgroundColor: corFundo,
      scale: 2,
      useCORS: true,
      ignoreElements: function (el) { return el.id === 'btn-baixar-furadeira'; }
    }).then(function (canvas) {
      var link = document.createElement('a');
      link.download = 'furadeira.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }).catch(function (err) {
      console.error(err);
      alert('Não foi possível gerar o PNG: ' + (err && err.message ? err.message : 'erro desconhecido'));
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = textoOriginal;
    });
  });
})();
</script>
<!-- ===== Fim do bloco Baixar PNG ===== -->
</body>
</html>
