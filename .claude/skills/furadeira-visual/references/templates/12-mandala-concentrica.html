<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>{{NOME_METODO}}</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a1a;
    --ink: #ffffff;
    --muted: #aaaacc;
    /* 4 quadrantes principais */
    --q1: #e0e0e0; --q1-dark: #999;
    --q2: #e0e0e0; --q2-dark: #999;
    --q3: #e0e0e0; --q3-dark: #999;
    --q4: #e0e0e0; --q4-dark: #999;
    --center: #00bcd4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 36px;
  }
  .header { text-align: center; }
  .method-name { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 26px; font-weight: 900; color: var(--ink); }
  .quadro-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .mandala-wrap { width: 860px; height: 860px; }
  .footer { font-size: 11px; color: #555; letter-spacing: 1.5px; text-transform: uppercase; }
</style>
</head>
<body>

<div class="header">
  <div class="method-name">{{NOME_METODO}}</div>
  <div class="quadro-sub">{{QUADRO}}</div>
</div>

<div class="mandala-wrap">
<svg viewBox="0 0 600 600" width="860" height="860" xmlns="http://www.w3.org/2000/svg">

  <!--
    Mandala de 4 quadrantes com anéis concêntricos.
    Estrutura (de fora para dentro):
    - Anel 4 (externo): nomes dos 4 quadrantes principais (rótulos grandes)
    - Anel 3: sub-itens de cada quadrante (raio 220→170)
    - Anel 2: elementos intermediários (raio 170→110)
    - Anel 1 (interno): elementos centrais (raio 110→55)
    - Núcleo: elemento central (raio 55)

    Quadrantes (sentido horário a partir do topo-direita):
    Q1: 315°→45°  (topo-direita)   NE
    Q2: 45°→135°  (baixo-direita)  SE
    Q3: 135°→225° (baixo-esquerda) SO
    Q4: 225°→315° (topo-esquerda)  NO

    Anel externo de labels (raio 260-300):
    Q1 label: ângulo 0°   → (300+0, 300-280) = (300, 20) não
    Posição label no centro do quadrante:
    Q1: ângulo=0° (topo)   → (300, 300-270)=(300,30)... não ideal
    Melhor: usar texto nas diagonais
    Q1 (NE): ângulo=0°    → topo centro → (300,30)...

    Vou usar uma abordagem mais simples:
    - 4 grandes setores alternando 2 tons de cinza
    - Labels externos com textos diagonais
    - Anéis internos com linhas divisórias
    - Centro colorido
  -->

  <!-- ANEL EXTERNO 4: raio 270 — 4 quadrantes de 90° -->
  <!-- Q1: -90° a 0° (topo-direita) -->
  <path d="M 300,300 L 300,30 A 270,270 0 0,1 570,300 Z" fill="#c8c8c8" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Q2: 0° a 90° (baixo-direita) -->
  <path d="M 300,300 L 570,300 A 270,270 0 0,1 300,570 Z" fill="#d8d8d8" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Q3: 90° a 180° (baixo-esquerda) -->
  <path d="M 300,300 L 300,570 A 270,270 0 0,1 30,300 Z" fill="#c8c8c8" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Q4: 180° a 270° (topo-esquerda) -->
  <path d="M 300,300 L 30,300 A 270,270 0 0,1 300,30 Z" fill="#d8d8d8" stroke="#1a1a1a" stroke-width="2"/>

  <!-- ANEL 3: raio 200 — mesmo padrão -->
  <path d="M 300,300 L 300,100 A 200,200 0 0,1 500,300 Z" fill="#b0b0b0" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 300,300 L 500,300 A 200,200 0 0,1 300,500 Z" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 300,300 L 300,500 A 200,200 0 0,1 100,300 Z" fill="#b0b0b0" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 300,300 L 100,300 A 200,200 0 0,1 300,100 Z" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Sub-divisões do anel 3 (cada quadrante em 2) -->
  <!-- Q1 dividido: diagonal NE -->
  <line x1="300" y1="300" x2="441" y2="159" stroke="#1a1a1a" stroke-width="1" opacity="0.5"/>
  <!-- Q2 dividido -->
  <line x1="300" y1="300" x2="441" y2="441" stroke="#1a1a1a" stroke-width="1" opacity="0.5"/>
  <!-- Q3 dividido -->
  <line x1="300" y1="300" x2="159" y2="441" stroke="#1a1a1a" stroke-width="1" opacity="0.5"/>
  <!-- Q4 dividido -->
  <line x1="300" y1="300" x2="159" y2="159" stroke="#1a1a1a" stroke-width="1" opacity="0.5"/>

  <!-- ANEL 2: raio 130 -->
  <path d="M 300,300 L 300,170 A 130,130 0 0,1 430,300 Z" fill="#888" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 300,300 L 430,300 A 130,130 0 0,1 300,430 Z" fill="#999" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 300,300 L 300,430 A 130,130 0 0,1 170,300 Z" fill="#888" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 300,300 L 170,300 A 130,130 0 0,1 300,170 Z" fill="#999" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Sub-divisões anel 2 -->
  <line x1="300" y1="300" x2="392" y2="208" stroke="#1a1a1a" stroke-width="1" opacity="0.6"/>
  <line x1="300" y1="300" x2="392" y2="392" stroke="#1a1a1a" stroke-width="1" opacity="0.6"/>
  <line x1="300" y1="300" x2="208" y2="392" stroke="#1a1a1a" stroke-width="1" opacity="0.6"/>
  <line x1="300" y1="300" x2="208" y2="208" stroke="#1a1a1a" stroke-width="1" opacity="0.6"/>

  <!-- ANEL 1 (interno): raio 65 -->
  <path d="M 300,300 L 300,235 A 65,65 0 0,1 365,300 Z" fill="#555" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 300,300 L 365,300 A 65,65 0 0,1 300,365 Z" fill="#666" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 300,300 L 300,365 A 65,65 0 0,1 235,300 Z" fill="#555" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 300,300 L 235,300 A 65,65 0 0,1 300,235 Z" fill="#666" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- NÚCLEO CENTRAL -->
  <circle cx="300" cy="300" r="38" fill="var(--center)" stroke="white" stroke-width="2"/>
  <text x="300" y="296" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="10" font-weight="800" fill="white">{{NUCLEO_1}}</text>
  <text x="300" y="310" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="10" font-weight="800" fill="white">{{NUCLEO_2}}</text>

  <!-- TEXTO DOS EIXOS PRINCIPAIS (cruzes) -->
  <line x1="300" y1="30" x2="300" y2="570" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="30" y1="300" x2="570" y2="300" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- RÓTULOS DOS 4 QUADRANTES (borda externa, inclinados) -->
  <!-- Q1: topo-direita -->
  <text x="470" y="145" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="20" font-weight="900" fill="#1a1a1a" transform="rotate(45,470,145)">{{QUADRANTE_1}}</text>
  <!-- Q2: baixo-direita -->
  <text x="470" y="455" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="20" font-weight="900" fill="#1a1a1a" transform="rotate(-45,470,455)">{{QUADRANTE_2}}</text>
  <!-- Q3: baixo-esquerda -->
  <text x="130" y="455" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="20" font-weight="900" fill="#1a1a1a" transform="rotate(45,130,455)">{{QUADRANTE_3}}</text>
  <!-- Q4: topo-esquerda -->
  <text x="130" y="145" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="20" font-weight="900" fill="#1a1a1a" transform="rotate(-45,130,145)">{{QUADRANTE_4}}</text>

  <!-- TEXTO DOS SUB-ITENS no anel 3 (raio ~235, 8 posições) -->
  <!-- Cada quadrante tem 2 sub-itens. Ângulos dos 8 slots:
       22.5°, 67.5°, 112.5°, 157.5°, 202.5°, 247.5°, 292.5°, 337.5°
       (ângulo 0°=topo, cx=300, cy=300)
       x=300+235*sin(a), y=300-235*cos(a) -->
  <!-- 22.5°: sin=0.383,cos=0.924 → (390,83) -->
  <text x="390" y="83" text-anchor="middle" font-family="Inter" font-size="9.5" font-weight="600" fill="#333">{{ITEM_1_A}}</text>
  <!-- 67.5°: sin=0.924,cos=0.383 → (517,210) -->
  <text x="517" y="213" text-anchor="start" font-family="Inter" font-size="9.5" font-weight="600" fill="#333">{{ITEM_1_B}}</text>
  <!-- 112.5°: sin=0.924,cos=-0.383 → (517,390) -->
  <text x="517" y="393" text-anchor="start" font-family="Inter" font-size="9.5" font-weight="600" fill="#333">{{ITEM_2_A}}</text>
  <!-- 157.5°: sin=0.383,cos=-0.924 → (390,517) -->
  <text x="390" y="520" text-anchor="middle" font-family="Inter" font-size="9.5" font-weight="600" fill="#333">{{ITEM_2_B}}</text>
  <!-- 202.5°: sin=-0.383,cos=-0.924 → (210,517) -->
  <text x="210" y="520" text-anchor="middle" font-family="Inter" font-size="9.5" font-weight="600" fill="#333">{{ITEM_3_A}}</text>
  <!-- 247.5°: sin=-0.924,cos=-0.383 → (83,390) -->
  <text x="78" y="393" text-anchor="end" font-family="Inter" font-size="9.5" font-weight="600" fill="#333">{{ITEM_3_B}}</text>
  <!-- 292.5°: sin=-0.924,cos=0.383 → (83,210) -->
  <text x="78" y="213" text-anchor="end" font-family="Inter" font-size="9.5" font-weight="600" fill="#333">{{ITEM_4_A}}</text>
  <!-- 337.5°: sin=-0.383,cos=0.924 → (210,83) -->
  <text x="210" y="83" text-anchor="middle" font-family="Inter" font-size="9.5" font-weight="600" fill="#333">{{ITEM_4_B}}</text>

  <!-- RÓTULOS no anel 2 (raio ~155) — 8 posições internas -->
  <text x="409" y="190" text-anchor="middle" font-family="Inter" font-size="8" fill="#222" transform="rotate(45,409,190)">{{ELEM_1_A}}</text>
  <text x="409" y="408" text-anchor="middle" font-family="Inter" font-size="8" fill="#222" transform="rotate(-45,409,408)">{{ELEM_2_A}}</text>
  <text x="191" y="408" text-anchor="middle" font-family="Inter" font-size="8" fill="#222" transform="rotate(45,191,408)">{{ELEM_3_A}}</text>
  <text x="191" y="190" text-anchor="middle" font-family="Inter" font-size="8" fill="#222" transform="rotate(-45,191,190)">{{ELEM_4_A}}</text>

  <!-- Título do anel interno (os 4 quadrantes internos) -->
  <text x="300" y="215" text-anchor="middle" font-family="Inter" font-size="8.5" font-weight="600" fill="white">{{INT_1}}</text>
  <text x="385" y="303" text-anchor="start" font-family="Inter" font-size="8.5" font-weight="600" fill="white">{{INT_2}}</text>
  <text x="300" y="385" text-anchor="middle" font-family="Inter" font-size="8.5" font-weight="600" fill="white">{{INT_3}}</text>
  <text x="215" y="303" text-anchor="end" font-family="Inter" font-size="8.5" font-weight="600" fill="white">{{INT_4}}</text>

  <!-- Nota: para adicionar mais texto nos sub-anéis, repita o padrão acima -->
  <!-- Os elementos {{...}} são substituídos pelos dados do produto -->

</svg>
</div>

<div class="footer">{{NOME_PRODUTO}} · Metodologia exclusiva</div>
<!-- ===== Botão Baixar PNG (injetado automaticamente pela skill furadeira-visual) =====
  Regra: todo HTML gerado pelo fluxo HTML da Furadeira (command /furadeira-visual, opção 1)
  precisa conter este bloco imediatamente antes de </body>.
  Por quê: o aluno precisa conseguir exportar a Furadeira como imagem sem depender de script
  Python, Playwright, Puppeteer ou conhecimento técnico. Um clique no próprio HTML resolve.
  Como usar: copie o bloco inteiro (comentário e tudo) e cole antes de </body>. Não altere
  nomes de IDs, classes ou o nome do arquivo "furadeira.png" sem atualizar o command também.
-->
<button id="btn-baixar-furadeira" type="button" aria-label="Baixar Furadeira como PNG">Baixar PNG</button>
<style>
  #btn-baixar-furadeira {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 99999;
    padding: 12px 22px;
    background: #111827;
    color: #ffffff;
    border: 0;
    border-radius: 10px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #btn-baixar-furadeira:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
  }
  #btn-baixar-furadeira:disabled {
    opacity: 0.6;
    cursor: wait;
    transform: none;
  }
  @media print {
    #btn-baixar-furadeira { display: none; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function () {
  var btn = document.getElementById('btn-baixar-furadeira');
  if (!btn) return;
  btn.addEventListener('click', function () {
    if (typeof html2canvas === 'undefined') {
      alert('Não foi possível carregar a biblioteca de exportação. Verifique sua conexão com a internet e tente de novo.');
      return;
    }
    var textoOriginal = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Gerando PNG...';
    var corFundo = getComputedStyle(document.body).backgroundColor || '#ffffff';
    html2canvas(document.body, {
      backgroundColor: corFundo,
      scale: 2,
      useCORS: true,
      ignoreElements: function (el) { return el.id === 'btn-baixar-furadeira'; }
    }).then(function (canvas) {
      var link = document.createElement('a');
      link.download = 'furadeira.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }).catch(function (err) {
      console.error(err);
      alert('Não foi possível gerar o PNG: ' + (err && err.message ? err.message : 'erro desconhecido'));
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = textoOriginal;
    });
  });
})();
</script>
<!-- ===== Fim do bloco Baixar PNG ===== -->
</body>
</html>
