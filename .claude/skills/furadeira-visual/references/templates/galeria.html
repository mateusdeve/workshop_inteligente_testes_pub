<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Galeria de Templates — Furadeira Visual</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #0d0d0d;
    font-family: 'Inter', sans-serif;
    color: #f0f0f0;
    display: flex;
  }

  /* SIDEBAR */
  .sidebar {
    width: 280px;
    flex-shrink: 0;
    height: 100vh;
    background: #111;
    border-right: 1px solid rgba(255,255,255,0.08);
    display: flex;
    flex-direction: column;
  }
  .sidebar-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .sidebar-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #fff;
  }
  .sidebar-sub {
    font-size: 10px;
    color: #666;
    margin-top: 4px;
  }
  .badge-count {
    display: inline-block;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 100px;
    padding: 2px 8px;
    font-size: 10px;
    font-weight: 600;
    color: #aaa;
    margin-top: 10px;
  }

  .sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 0;
  }
  .sidebar-list::-webkit-scrollbar { width: 6px; }
  .sidebar-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

  .btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    background: transparent;
    border: none;
    border-left: 3px solid transparent;
    color: #999;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 10px 16px;
    cursor: pointer;
    transition: all 0.12s;
    text-align: left;
  }
  .btn:hover { background: rgba(255,255,255,0.04); color: #fff; }
  .btn.active {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border-left-color: #fff;
    font-weight: 700;
  }
  .btn-num {
    font-family: monospace;
    font-size: 11px;
    color: #555;
    width: 22px;
    flex-shrink: 0;
  }
  .btn.active .btn-num { color: #888; }

  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 10px;
    color: #555;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .btn-open {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 5px;
    color: #aaa;
    font-size: 10px;
    font-weight: 600;
    padding: 4px 10px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.15s;
  }
  .btn-open:hover { background: rgba(255,255,255,0.15); color: #fff; }

  /* MAIN */
  .main {
    flex: 1;
    height: 100vh;
    background: #0d0d0d;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .frame-shell {
    position: relative;
    background: #fff;
    box-shadow: 0 12px 60px rgba(0,0,0,0.4);
    border-radius: 6px;
    overflow: hidden;
  }
  iframe {
    border: none;
    display: block;
    background: #fff;
    transform-origin: top left;
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-title">Furadeira Visual</div>
    <div class="sidebar-sub">Galeria de templates</div>
    <div class="badge-count">16 layouts</div>
  </div>
  <div class="sidebar-list" id="nav"></div>
  <div class="sidebar-footer">
    <span id="info-dim">—</span>
    <a class="btn-open" id="btn-open" href="#" target="_blank">Nova aba</a>
  </div>
</aside>

<main class="main" id="main">
  <div class="frame-shell" id="frame-shell">
    <iframe id="preview-frame" src=""></iframe>
  </div>
</main>

<script>
const templates = [
  { num: "01", file: "01-linear-horizontal.html",       name: "Linear Horizontal",          w: 1920, h: 1080 },
  { num: "02", file: "02-roadmap-vertical.html",        name: "Roadmap Vertical",           w: 1080, h: 1920 },
  { num: "03", file: "03-piramide-invertida.html",      name: "Pirâmide Invertida",         w: 1080, h: 1080 },
  { num: "04", file: "04-hub-central.html",             name: "Hub Central",                w: 1080, h: 1080 },
  { num: "05", file: "05-fluxograma-condicional.html",  name: "Fluxograma Condicional",     w: 1920, h: 1080 },
  { num: "06", file: "06-puzzle-3pecas.html",           name: "Puzzle 3 Peças",             w: 1080, h: 900  },
  { num: "07", file: "07-hexagonos-cadeia.html",        name: "Hexágonos em Cadeia",        w: 1080, h: 1800 },
  { num: "08", file: "08-grid-categorias.html",         name: "Grid de Categorias",         w: 1080, h: 800  },
  { num: "09", file: "09-quadrantes-2x2.html",          name: "Quadrantes 2×2",             w: 1080, h: 680  },
  { num: "10", file: "10-roda-eneagrama.html",          name: "Roda com Pontos",            w: 1080, h: 1080 },
  { num: "11", file: "11-roda-octogonal.html",          name: "Roda Octogonal",             w: 1080, h: 1080 },
  { num: "12", file: "12-mandala-concentrica.html",     name: "Mandala Concêntrica",        w: 1080, h: 1080 },
  { num: "13", file: "13-trilha-ondulada.html",         name: "Trilha Ondulada",            w: 1080, h: 1800 },
  { num: "14", file: "14-curva-exponencial.html",       name: "Curva Exponencial",          w: 1080, h: 640  },
  { num: "15", file: "15-regua-comportamento.html",     name: "Régua de Comportamento",     w: 1080, h: 750  },
  { num: "16", file: "16-hub-numerado-quadrantes.html", name: "Hub Numerado c/ Quadrantes", w: 1080, h: 1100 },
];

const nav     = document.getElementById("nav");
const frame   = document.getElementById("preview-frame");
const shell   = document.getElementById("frame-shell");
const mainEl  = document.getElementById("main");
const infoDim = document.getElementById("info-dim");
const btnOpen = document.getElementById("btn-open");

let currentDims = { w: 1080, h: 800 };

function fitToView() {
  const { w, h } = currentDims;
  const padding = 40;
  const availW = mainEl.clientWidth  - padding;
  const availH = mainEl.clientHeight - padding;
  const s = Math.min(availW / w, availH / h, 1);

  frame.style.width  = w + "px";
  frame.style.height = h + "px";
  frame.style.transform = `scale(${s})`;

  shell.style.width  = Math.round(w * s) + "px";
  shell.style.height = Math.round(h * s) + "px";
}

function load(idx) {
  const t = templates[idx];
  btnOpen.href = t.file;
  infoDim.textContent = `${t.w} × ${t.h}`;

  currentDims = { w: t.w, h: t.h };
  fitToView();
  frame.src = t.file;

  Array.from(nav.children).forEach(b => b.classList.remove("active"));
  nav.children[idx].classList.add("active");
}

window.addEventListener("resize", fitToView);

templates.forEach((t, i) => {
  const btn = document.createElement("button");
  btn.className = "btn";
  btn.innerHTML = `<span class="btn-num">${t.num}</span><span>${t.name}</span>`;
  btn.onclick = () => load(i);
  nav.appendChild(btn);
});

load(0);
</script>
<!-- ===== Botão Baixar PNG (injetado automaticamente pela skill furadeira-visual) =====
  Regra: todo HTML gerado pelo fluxo HTML da Furadeira (command /furadeira-visual, opção 1)
  precisa conter este bloco imediatamente antes de </body>.
  Por quê: o aluno precisa conseguir exportar a Furadeira como imagem sem depender de script
  Python, Playwright, Puppeteer ou conhecimento técnico. Um clique no próprio HTML resolve.
  Como usar: copie o bloco inteiro (comentário e tudo) e cole antes de </body>. Não altere
  nomes de IDs, classes ou o nome do arquivo "furadeira.png" sem atualizar o command também.
-->
<button id="btn-baixar-furadeira" type="button" aria-label="Baixar Furadeira como PNG">Baixar PNG</button>
<style>
  #btn-baixar-furadeira {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 99999;
    padding: 12px 22px;
    background: #111827;
    color: #ffffff;
    border: 0;
    border-radius: 10px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #btn-baixar-furadeira:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
  }
  #btn-baixar-furadeira:disabled {
    opacity: 0.6;
    cursor: wait;
    transform: none;
  }
  @media print {
    #btn-baixar-furadeira { display: none; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function () {
  var btn = document.getElementById('btn-baixar-furadeira');
  if (!btn) return;
  btn.addEventListener('click', function () {
    if (typeof html2canvas === 'undefined') {
      alert('Não foi possível carregar a biblioteca de exportação. Verifique sua conexão com a internet e tente de novo.');
      return;
    }
    var textoOriginal = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Gerando PNG...';
    var origBg = document.body.style.background;
    document.body.style.background = 'transparent';
    html2canvas(document.body, {
      backgroundColor: null,
      scale: 2,
      useCORS: true,
      ignoreElements: function (el) { return el.id === 'btn-baixar-furadeira'; }
    }).then(function (canvas) {
      document.body.style.background = origBg;
      var link = document.createElement('a');
      link.download = 'furadeira.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }).catch(function (err) {
      document.body.style.background = origBg;
      console.error(err);
      alert('Não foi possível gerar o PNG: ' + (err && err.message ? err.message : 'erro desconhecido'));
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = textoOriginal;
    });
  });
})();
</script>
<!-- ===== Fim do bloco Baixar PNG ===== -->
</body>
</html>
