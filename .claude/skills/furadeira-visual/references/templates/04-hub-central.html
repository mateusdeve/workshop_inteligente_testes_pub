<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Furadeira Hub Central: {{NOME_METODO}}</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fde68a;
    --bg-alt: #fef3c7;
    --ink: #1f2937;
    --accent: #f59e0b;
    --line: #1f2937;
    --muted: #4b5563;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Patrick Hand', sans-serif;
    padding: 60px;
    position: relative;
  }
  .header-top {
    position: absolute;
    top: 50px;
    left: 0;
    right: 0;
    text-align: center;
  }
  .header-top h1 {
    font-family: 'Caveat', cursive;
    font-size: 64px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
  }
  .header-top .underline {
    display: inline-block;
    width: 200px;
    height: 8px;
    background: var(--ink);
    border-radius: 4px;
    margin-top: 8px;
    transform: skewX(-12deg);
  }
  .canvas {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .centro {
    width: 320px;
    height: 320px;
    background: var(--accent);
    border: 5px solid var(--line);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    box-shadow: 8px 8px 0 var(--line);
    position: relative;
    z-index: 10;
  }
  .centro .label {
    font-family: 'Caveat', cursive;
    font-size: 28px;
    color: var(--ink);
    opacity: 0.7;
  }
  .centro h2 {
    font-family: 'Caveat', cursive;
    font-size: 42px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.05;
    margin-top: 8px;
  }
  .satelite {
    position: absolute;
    width: 220px;
    background: var(--bg-alt);
    border: 4px solid var(--line);
    border-radius: 20px;
    padding: 18px 20px;
    text-align: center;
    box-shadow: 5px 5px 0 var(--line);
    z-index: 5;
  }
  .satelite .num {
    display: inline-block;
    width: 40px;
    height: 40px;
    background: var(--accent);
    border: 3px solid var(--line);
    border-radius: 50%;
    line-height: 34px;
    font-family: 'Caveat', cursive;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .satelite h3 {
    font-family: 'Caveat', cursive;
    font-size: 28px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.1;
    margin-bottom: 4px;
  }
  .satelite p {
    font-size: 16px;
    line-height: 1.3;
    color: var(--muted);
  }
  /* Posições para 4 satélites. Ajustar via top/left para 3, 5, 6 etapas. */
  .s1 { top: 200px; left: 80px; }
  .s2 { top: 200px; right: 80px; }
  .s3 { bottom: 180px; left: 80px; }
  .s4 { bottom: 180px; right: 80px; }
  .s5 { top: 50%; left: 30px; transform: translateY(-50%); }
  .s6 { top: 50%; right: 30px; transform: translateY(-50%); }
  /* Linhas SVG conectando centro aos satélites. */
  .conexoes {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  footer {
    position: absolute;
    bottom: 30px;
    left: 0;
    right: 0;
    text-align: center;
    color: var(--ink);
    font-family: 'Caveat', cursive;
    font-size: 28px;
    opacity: 0.7;
  }
</style>
</head>
<body>
  <div class="header-top">
    <h1>{{NOME_METODO}}</h1>
    <div class="underline"></div>
  </div>
  <svg class="conexoes" viewBox="0 0 1080 1080">
    <line x1="540" y1="540" x2="190" y2="280" stroke="#1f2937" stroke-width="4" stroke-dasharray="8 6"/>
    <line x1="540" y1="540" x2="890" y2="280" stroke="#1f2937" stroke-width="4" stroke-dasharray="8 6"/>
    <line x1="540" y1="540" x2="190" y2="800" stroke="#1f2937" stroke-width="4" stroke-dasharray="8 6"/>
    <line x1="540" y1="540" x2="890" y2="800" stroke="#1f2937" stroke-width="4" stroke-dasharray="8 6"/>
  </svg>
  <div class="canvas">
    <div class="centro">
      <span class="label">Quadro</span>
      <h2>{{QUADRO}}</h2>
    </div>
  </div>
  <div class="satelite s1">
    <div class="num">1</div>
    <h3>{{ETAPA_1_NOME}}</h3>
    <p>{{ETAPA_1_DESC}}</p>
  </div>
  <div class="satelite s2">
    <div class="num">2</div>
    <h3>{{ETAPA_2_NOME}}</h3>
    <p>{{ETAPA_2_DESC}}</p>
  </div>
  <div class="satelite s3">
    <div class="num">3</div>
    <h3>{{ETAPA_3_NOME}}</h3>
    <p>{{ETAPA_3_DESC}}</p>
  </div>
  <div class="satelite s4">
    <div class="num">4</div>
    <h3>{{ETAPA_4_NOME}}</h3>
    <p>{{ETAPA_4_DESC}}</p>
  </div>
<!-- ===== Botão Baixar PNG (injetado automaticamente pela skill furadeira-visual) =====
  Regra: todo HTML gerado pelo fluxo HTML da Furadeira (command /furadeira-visual, opção 1)
  precisa conter este bloco imediatamente antes de </body>.
  Por quê: o aluno precisa conseguir exportar a Furadeira como imagem sem depender de script
  Python, Playwright, Puppeteer ou conhecimento técnico. Um clique no próprio HTML resolve.
  Como usar: copie o bloco inteiro (comentário e tudo) e cole antes de </body>. Não altere
  nomes de IDs, classes ou o nome do arquivo "furadeira.png" sem atualizar o command também.
-->
<button id="btn-baixar-furadeira" type="button" aria-label="Baixar Furadeira como PNG">Baixar PNG</button>
<style>
  #btn-baixar-furadeira {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 99999;
    padding: 12px 22px;
    background: #111827;
    color: #ffffff;
    border: 0;
    border-radius: 10px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #btn-baixar-furadeira:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
  }
  #btn-baixar-furadeira:disabled {
    opacity: 0.6;
    cursor: wait;
    transform: none;
  }
  @media print {
    #btn-baixar-furadeira { display: none; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function () {
  var btn = document.getElementById('btn-baixar-furadeira');
  if (!btn) return;
  btn.addEventListener('click', function () {
    if (typeof html2canvas === 'undefined') {
      alert('Não foi possível carregar a biblioteca de exportação. Verifique sua conexão com a internet e tente de novo.');
      return;
    }
    var textoOriginal = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Gerando PNG...';
    var origBg = document.body.style.background;
    document.body.style.background = 'transparent';
    html2canvas(document.body, {
      backgroundColor: null,
      scale: 2,
      useCORS: true,
      ignoreElements: function (el) { return el.id === 'btn-baixar-furadeira'; }
    }).then(function (canvas) {
      document.body.style.background = origBg;
      var link = document.createElement('a');
      link.download = 'furadeira.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }).catch(function (err) {
      document.body.style.background = origBg;
      console.error(err);
      alert('Não foi possível gerar o PNG: ' + (err && err.message ? err.message : 'erro desconhecido'));
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = textoOriginal;
    });
  });
})();
</script>
<!-- ===== Fim do bloco Baixar PNG ===== -->
</body>
</html>
