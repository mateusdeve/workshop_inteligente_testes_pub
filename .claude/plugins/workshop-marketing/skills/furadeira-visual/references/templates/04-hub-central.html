<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Furadeira Hub Central: {{NOME_METODO}}</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fde68a;
    --bg-alt: #fef3c7;
    --ink: #1f2937;
    --accent: #f59e0b;
    --line: #1f2937;
    --muted: #4b5563;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Patrick Hand', sans-serif;
    padding: 60px;
    position: relative;
  }
  .header-top {
    position: absolute;
    top: 50px;
    left: 0;
    right: 0;
    text-align: center;
  }
  .header-top h1 {
    font-family: 'Caveat', cursive;
    font-size: 64px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
  }
  .header-top .underline {
    display: inline-block;
    width: 200px;
    height: 8px;
    background: var(--ink);
    border-radius: 4px;
    margin-top: 8px;
    transform: skewX(-12deg);
  }
  .canvas {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .centro {
    width: 320px;
    height: 320px;
    background: var(--accent);
    border: 5px solid var(--line);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    box-shadow: 8px 8px 0 var(--line);
    position: relative;
    z-index: 10;
  }
  .centro .label {
    font-family: 'Caveat', cursive;
    font-size: 28px;
    color: var(--ink);
    opacity: 0.7;
  }
  .centro h2 {
    font-family: 'Caveat', cursive;
    font-size: 42px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.05;
    margin-top: 8px;
  }
  .satelite {
    position: absolute;
    width: 220px;
    background: var(--bg-alt);
    border: 4px solid var(--line);
    border-radius: 20px;
    padding: 18px 20px;
    text-align: center;
    box-shadow: 5px 5px 0 var(--line);
    z-index: 5;
  }
  .satelite .num {
    display: inline-block;
    width: 40px;
    height: 40px;
    background: var(--accent);
    border: 3px solid var(--line);
    border-radius: 50%;
    line-height: 34px;
    font-family: 'Caveat', cursive;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .satelite h3 {
    font-family: 'Caveat', cursive;
    font-size: 28px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.1;
    margin-bottom: 4px;
  }
  .satelite p {
    font-size: 16px;
    line-height: 1.3;
    color: var(--muted);
  }
  /* Posições para 4 satélites. Ajustar via top/left para 3, 5, 6 etapas. */
  .s1 { top: 200px; left: 80px; }
  .s2 { top: 200px; right: 80px; }
  .s3 { bottom: 180px; left: 80px; }
  .s4 { bottom: 180px; right: 80px; }
  .s5 { top: 50%; left: 30px; transform: translateY(-50%); }
  .s6 { top: 50%; right: 30px; transform: translateY(-50%); }
  /* Linhas SVG conectando centro aos satélites. */
  .conexoes {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  footer {
    position: absolute;
    bottom: 30px;
    left: 0;
    right: 0;
    text-align: center;
    color: var(--ink);
    font-family: 'Caveat', cursive;
    font-size: 28px;
    opacity: 0.7;
  }
</style>
</head>
<body>
  <div class="header-top">
    <h1>{{NOME_METODO}}</h1>
    <div class="underline"></div>
  </div>
  <svg class="conexoes" viewBox="0 0 1080 1080">
    <line x1="540" y1="540" x2="190" y2="280" stroke="#1f2937" stroke-width="4" stroke-dasharray="8 6"/>
    <line x1="540" y1="540" x2="890" y2="280" stroke="#1f2937" stroke-width="4" stroke-dasharray="8 6"/>
    <line x1="540" y1="540" x2="190" y2="800" stroke="#1f2937" stroke-width="4" stroke-dasharray="8 6"/>
    <line x1="540" y1="540" x2="890" y2="800" stroke="#1f2937" stroke-width="4" stroke-dasharray="8 6"/>
  </svg>
  <div class="canvas">
    <div class="centro">
      <span class="label">Quadro</span>
      <h2>{{QUADRO}}</h2>
    </div>
  </div>
  <div class="satelite s1">
    <div class="num">1</div>
    <h3>{{ETAPA_1_NOME}}</h3>
    <p>{{ETAPA_1_DESC}}</p>
  </div>
  <div class="satelite s2">
    <div class="num">2</div>
    <h3>{{ETAPA_2_NOME}}</h3>
    <p>{{ETAPA_2_DESC}}</p>
  </div>
  <div class="satelite s3">
    <div class="num">3</div>
    <h3>{{ETAPA_3_NOME}}</h3>
    <p>{{ETAPA_3_DESC}}</p>
  </div>
  <div class="satelite s4">
    <div class="num">4</div>
    <h3>{{ETAPA_4_NOME}}</h3>
    <p>{{ETAPA_4_DESC}}</p>
  </div>
  <footer>{{NOME_PRODUTO}}</footer>
</body>
</html>
