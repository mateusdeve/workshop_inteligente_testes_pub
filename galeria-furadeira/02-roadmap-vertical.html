<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Furadeira Roadmap: {{NOME_METODO}}</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf5ff;
    --bg-alt: #f3e8ff;
    --ink: #1e1b4b;
    --accent: #7c3aed;
    --line: #4c1d95;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    padding: 100px 80px;
    display: flex;
    flex-direction: column;
  }
  header { text-align: center; margin-bottom: 60px; }
  header .label {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    padding: 10px 24px;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  header h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 72px;
    font-weight: 800;
    color: var(--line);
    line-height: 1.05;
    margin-bottom: 20px;
  }
  header p {
    font-size: 28px;
    color: var(--muted);
    line-height: 1.4;
  }
  .timeline {
    position: relative;
    padding-left: 100px;
    flex: 1;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 40px;
    top: 20px;
    bottom: 20px;
    width: 6px;
    background: var(--accent);
    border-radius: 999px;
  }
  .etapa {
    position: relative;
    background: var(--bg-alt);
    border: 3px solid var(--line);
    border-radius: 20px;
    padding: 28px 32px;
    margin-bottom: 28px;
    box-shadow: 5px 5px 0 var(--line);
  }
  .etapa .num {
    position: absolute;
    left: -100px;
    top: 20px;
    width: 80px;
    height: 80px;
    background: var(--accent);
    color: #fff;
    border: 4px solid var(--bg);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 36px;
    font-weight: 800;
    box-shadow: 0 0 0 3px var(--line);
  }
  .etapa h3 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 32px;
    font-weight: 800;
    color: var(--line);
    margin-bottom: 10px;
    line-height: 1.15;
  }
  .etapa p {
    font-size: 20px;
    line-height: 1.45;
    color: var(--muted);
  }
  footer {
    text-align: center;
    margin-top: 40px;
    color: var(--muted);
    font-size: 22px;
    letter-spacing: 1.5px;
  }
</style>
</head>
<body>
  <header>
    <span class="label">Método</span>
    <h1>{{NOME_METODO}}</h1>
    <p>{{QUADRO}}</p>
  </header>
  <div class="timeline">
    <div class="etapa">
      <div class="num">1</div>
      <h3>{{ETAPA_NOME}}</h3>
      <p>{{ETAPA_DESCRICAO}}</p>
    </div>
    <!-- Repetir N vezes -->
  </div>
  <footer>{{NOME_PRODUTO}}</footer>
</body>
</html>
